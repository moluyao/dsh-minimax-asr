<!doctype html>
<!-- Preview of the control's glyphs at real size and enlarged. Rendered in a
     browser so the artwork can be judged, not just asserted. -->
<html lang="zh">
<head>
<meta charset="utf-8">
<title>dsh-minimax-asr icon preview</title>
<style>
  body { font: 14px/1.6 system-ui, "Segoe UI", sans-serif; margin: 32px; background: #fff; color: #111; }
  h1 { font-size: 18px; }
  .row { display: flex; align-items: center; gap: 32px; margin: 18px 0; }
  .cell { text-align: center; }
  .label { font-size: 12px; opacity: .65; margin-top: 8px; }
  /* The control's own box, at the sizes the composer uses. */
  .ctl {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    min-width: 32px; min-height: 32px; padding: 0 6px;
    border: 1px solid #d0d5dd; border-radius: 8px; background: transparent;
    color: inherit; font-size: 12px; line-height: 1; cursor: pointer;
  }
  .ctl.rec { padding: 0 10px; border-color: #e5484d; background: rgba(229,72,77,.10); color: #e5484d; }
  .ctl.hover { background: rgba(127,127,127,.12); }
  .ctl.dim { opacity: .5; }
  .dark { background: #17181c; color: #e8e8ea; padding: 18px 24px; border-radius: 10px; display: inline-block; }
</style>
</head>
<body>
<h1>MiniMax 语音输入图标</h1>

<div class="row">
  <div class="cell">
    <button class="ctl" title="用 MiniMax 语音识别听写" aria-label="用 MiniMax 语音识别听写">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
        <path fill="currentColor" d="M8 1.4c-1.2 0-2.1 1-2.1 2.1v4c0 1.2.9 2.1 2.1 2.1s2.1-.9 2.1-2.1v-4c0-1.1-.9-2.1-2.1-2.1z"/>
        <path stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none" d="M4.3 7.3v1.4c0 2 1.7 3.7 3.7 3.7s3.7-1.7 3.7-3.7V7.3"/>
        <path stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none" d="M8 12.5v1.2M5.6 13.8h4.8"/>
      </svg>
    </button>
    <div class="label">空闲（真实尺寸）</div>
  </div>

  <div class="cell">
    <button class="ctl hover" title="悬停">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path fill="currentColor" d="M8 1.4c-1.2 0-2.1 1-2.1 2.1v4c0 1.2.9 2.1 2.1 2.1s2.1-.9 2.1-2.1v-4c0-1.1-.9-2.1-2.1-2.1z"/>
        <path stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none" d="M4.3 7.3v1.4c0 2 1.7 3.7 3.7 3.7s3.7-1.7 3.7-3.7V7.3"/>
        <path stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none" d="M8 12.5v1.2M5.6 13.8h4.8"/>
      </svg>
    </button>
    <div class="label">悬停</div>
  </div>

  <div class="cell">
    <button class="ctl rec" title="停止并转写">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect x="4.2" y="4.2" width="7.6" height="7.6" rx="1.8" fill="currentColor"/>
      </svg>
      <span style="font-variant-numeric: tabular-nums">12秒</span>
    </button>
    <div class="label">录音中</div>
  </div>

  <div class="cell">
    <button class="ctl" title="转写中" disabled>
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect x="3.4" y="6.6" width="1.6" height="2.8" rx="0.8" fill="currentColor"/>
        <rect x="7.2" y="4.6" width="1.6" height="6.8" rx="0.8" fill="currentColor"/>
        <rect x="11" y="6" width="1.6" height="4" rx="0.8" fill="currentColor"/>
      </svg>
    </button>
    <div class="label">转写中</div>
  </div>
</div>

<h1>放大看形状</h1>
<div class="row">
  <div class="cell">
    <svg width="96" height="96" viewBox="0 0 16 16" fill="none">
      <path fill="currentColor" d="M8 1.4c-1.2 0-2.1 1-2.1 2.1v4c0 1.2.9 2.1 2.1 2.1s2.1-.9 2.1-2.1v-4c0-1.1-.9-2.1-2.1-2.1z"/>
      <path stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none" d="M4.3 7.3v1.4c0 2 1.7 3.7 3.7 3.7s3.7-1.7 3.7-3.7V7.3"/>
      <path stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none" d="M8 12.5v1.2M5.6 13.8h4.8"/>
    </svg>
    <div class="label">96px</div>
  </div>
  <div class="cell"><div class="dark">
    <svg width="48" height="48" viewBox="0 0 16 16" fill="none">
      <path fill="currentColor" d="M8 1.4c-1.2 0-2.1 1-2.1 2.1v4c0 1.2.9 2.1 2.1 2.1s2.1-.9 2.1-2.1v-4c0-1.1-.9-2.1-2.1-2.1z"/>
      <path stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none" d="M4.3 7.3v1.4c0 2 1.7 3.7 3.7 3.7s3.7-1.7 3.7-3.7V7.3"/>
      <path stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none" d="M8 12.5v1.2M5.6 13.8h4.8"/>
    </svg>
  </div><div class="label">深色主题</div></div>
</div>

<h1>在工具行里的观感</h1>
<div class="row" style="border:1px solid #e4e7ec; border-radius:10px; padding:14px 18px; width:max-content">
  <button class="ctl" style="border-color:transparent; color:inherit" title="指令">指令 ⌘</button>
  <button class="ctl" style="border-color:transparent" title="访问模式">🔒 工作区内修改</button>
  <button class="ctl" title="用 MiniMax 语音识别听写">
    <svg width="18" height="18" viewBox="0 0 16 16" fill="none">
      <path fill="currentColor" d="M8 1.4c-1.2 0-2.1 1-2.1 2.1v4c0 1.2.9 2.1 2.1 2.1s2.1-.9 2.1-2.1v-4c0-1.1-.9-2.1-2.1-2.1z"/>
      <path stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none" d="M4.3 7.3v1.4c0 2 1.7 3.7 3.7 3.7s3.7-1.7 3.7-3.7V7.3"/>
      <path stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none" d="M8 12.5v1.2M5.6 13.8h4.8"/>
    </svg>
  </button>
  <button class="ctl" style="border-color:transparent" title="发送消息">➤</button>
</div>

        <path stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none" d="M4.3 7.3v1.4c0 2 1.7 3.7 3.7 3.7s3.7-1.7 3.7-3.7V7.3"/>

</html>
