# dsh bundle patch: inserts this plugin into a profile's layer stack.
- insert:
    - id: minimax-asr
      name: 'dsh-minimax-asr'
      config:
        apiKeyEnv: MINIMAX_API_KEY
        baseURL: https://api.minimaxi.com
        model: asr-1.0
        responseFormat: json
        language: ''
        timestampLevel: ''
        maxRecordSeconds: 300
        maxFileMB: 50
        timeoutMs: 180000
        # Spoken announcements: a finished turn is read out through the
        # speakers of whichever browser keeps the GUI open.
        speakEnabled: true
        ttsModel: speech-2.8-hd
        ttsVoice: male-qn-jingying
        ttsSpeed: 1
        speakMaxChars: 80
        # Handsfree conversation: after each spoken reply the microphone
        # reopens by itself, and a finished transcript is submitted with no
        # click. Off unless the user asks for it (the composer's 对话 button).
        voiceLoop: false
        # How long a pause means the sentence is finished, and the longest one
        # spoken turn may run before it is sent anyway.
        voiceSilenceSeconds: 5
        voiceMaxTurnSeconds: 300
